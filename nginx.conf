server {
    listen 80;
    server_name mathisfollin.fr;
    return 301 https://www.mathisfollin.fr$request_uri;
}

server {
    listen 80 default_server;
    server_name www.mathisfollin.fr;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}